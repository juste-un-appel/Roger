<!DOCTYPE html>
<html>

<head>
    <title>Roger</title>
    <meta charset="utf-8">

    <style>
        .avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
    </style>
</head>

<body style="font-family:Arial;text-align:center;padding-top:50px;">

    <img src="photo1.jpeg" alt="Photo" class="avatar">

    <h1>Roger</h1>

    <button onclick="choisir()">Je ressens un manque</button>

    <h2 id="resultat"></h2>

    <script>
        const famille = [
            {
                nom: "Gui Pro",
                whatsapp: "33601718375"
            },
            {
                nom: "Gui Perso",
                whatsapp: "33672500863"
            }
        ];

        function choisir() {
            const personne =
                famille[Math.floor(Math.random() * famille.length)];

            document.getElementById("resultat").innerHTML =
                `${personne.nom}<br><br>
                <a href="https://wa.me/${personne.whatsapp}">
                📞 Contacter sur WhatsApp
                </a>`;
        }
    </script>

</body>
</html>
